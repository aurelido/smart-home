# --- Recibidor ---
- id: recibidor_bienvenida
  name: "Recibidor - Bienvenida"
  icon: mdi:door-open
  entities:
    light.luz_recibidor:
      state: "on"
      brightness: 200

- id: recibidor_nocturno
  name: "Recibidor - Nocturno"
  icon: mdi:weather-night
  entities:
    light.luz_recibidor:
      state: "on"
      brightness: 50

- id: recibidor_apagado
  name: "Recibidor - Apagado"
  icon: mdi:lightbulb-off
  entities:
    light.luz_recibidor:
      state: "off"
