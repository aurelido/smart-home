# =============================================================================
# Mosquitto MQTT Broker - Configuración
# =============================================================================
# Documentación: https://mosquitto.org/man/mosquitto-conf-5.html
# =============================================================================

# --- Listeners ---
listener 1883
protocol mqtt

listener 9001
protocol websockets

# --- Autenticación ---
# Generar archivo de contraseñas:
#   docker exec mosquitto mosquitto_passwd -c /mosquitto/config/password_file zigbee2mqtt
#   docker exec mosquitto mosquitto_passwd    /mosquitto/config/password_file homeassistant
allow_anonymous false
password_file /mosquitto/config/password_file

# --- Persistencia ---
persistence true
persistence_location /mosquitto/data/

# --- Logging ---
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# --- Conexiones ---
max_connections -1
max_queued_messages 1000

# --- Seguridad ---
# No permitir publicación anónima en topics del sistema
sys_interval 10
