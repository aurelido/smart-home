homeassistant: true
permit_join: false

mqtt:
  base_topic: zigbee2mqtt
  server: mqtt://192.168.1.100:1883
  user: homeassistant
  password: __MQTT_PASSWORD__
  reject_unauthorized: true

# --- Puerto serie (Home Assistant Connect ZBT-2, Silicon Labs MG24) ---
serial:
  port: /dev/ttyACM0
  adapter: ember
  baudrate: 460800
  rtscts: true

advanced:
  channel: 25
  pan_id: 0x5A3C
  ext_pan_id: [0x8F, 0x2B, 0x4D, 0x6E, 0x1A, 0x9C, 0x7F, 0x3E]
  network_key: [47, 92, 134, 201, 56, 178, 23, 145, 89, 212, 67, 198, 34, 156, 78, 223]
  log_level: warning
  log_output: [console, file]
  log_rotation: true
  log_max_files: 5
  log_max_size: 5
  transmit_power: 20

frontend:
  port: 8080
  host: 0.0.0.0