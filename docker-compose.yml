# ============================================
# CASA NÓRDICA - Docker Compose
# ============================================
# Configuración del usuario en .env (solo 6 variables)
# Valores estáticos hardcodeados aquí para simplicidad
# ============================================

# ============================================
# CONFIGURACIÓN COMPARTIDA
# ============================================
x-restart-policy: &restart-policy
  restart: unless-stopped

x-logging: &logging-config
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
      compress: "true"

# ============================================
# SERVICIOS
# ============================================
services:

  # ============================================
  # HOME ASSISTANT - Centro de control
  # Puerto: 8123
  # ============================================
  home-assistant:
    <<: [*restart-policy, *logging-config]
    image: ghcr.io/home-assistant/home-assistant:2026.3
    container_name: home-assistant
    hostname: home-assistant
    network_mode: host
    privileged: false

    volumes:
      - ./homeassistant/config:/config:rw
      - ./homeassistant/ssl:/ssl:ro
      - ./homeassistant/addons:/addons:rw
      - ./homeassistant/media:/media:rw
      - ./backups/homeassistant:/backup:rw
      - /etc/localtime:/etc/localtime:ro

    environment:
      TZ: ${TZ:-Europe/Madrid}

    depends_on:
      mosquitto:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8123/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # ============================================
  # ZIGBEE2MQTT - Bridge Zigbee → MQTT
  # Puerto: 8080 | Adaptador: ZBT-2 (ember)
  # ============================================
  zigbee2mqtt:
    <<: [*restart-policy, *logging-config]
    image: ghcr.io/koenkk/zigbee2mqtt:2.1.1
    container_name: zigbee2mqtt
    hostname: zigbee2mqtt
    network_mode: host
    privileged: false

    volumes:
      - ./zigbee2mqtt/data:/app/data:rw
      - ./backups/zigbee2mqtt:/backup:rw
      - /run/udev:/run/udev:ro

    environment:
      TZ: ${TZ:-Europe/Madrid}
      ZIGBEE2MQTT_DATA: /app/data

    devices:
      - ${ZIGBEE_DEVICE:-/dev/ttyACM0}:${ZIGBEE_DEVICE:-/dev/ttyACM0}

    depends_on:
      mosquitto:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ============================================
  # MATTER HUB - Bridge HA → Matter (Alexa, Google, Apple)
  # Puerto: 8482 (Web UI)
  # Docs: https://riddix.github.io/home-assistant-matter-hub/
  # ============================================
  matter-hub:
    <<: [*restart-policy, *logging-config]
    image: ghcr.io/riddix/home-assistant-matter-hub:latest
    container_name: matter-hub
    hostname: matter-hub
    network_mode: host

    volumes:
      - ./matter-hub/data:/data

    environment:
      TZ: ${TZ:-Europe/Madrid}
      HAMH_HOME_ASSISTANT_URL: http://localhost:8123
      HAMH_HOME_ASSISTANT_ACCESS_TOKEN: ${HA_ACCESS_TOKEN}
      HAMH_LOG_LEVEL: info
      HAMH_HTTP_PORT: "8482"

    depends_on:
      home-assistant:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8482/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ============================================
  # MOSQUITTO - Broker MQTT
  # Puerto: 1883 (MQTT) | 9001 (WebSocket)
  # ============================================
  mosquitto:
    <<: [*restart-policy, *logging-config]
    image: eclipse-mosquitto:2.0.21
    container_name: mosquitto
    hostname: mosquitto
    network_mode: host
    privileged: false

    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data:rw
      - ./mosquitto/log:/mosquitto/log:rw
      - ./backups/mosquitto:/backup:rw

    environment:
      TZ: ${TZ:-Europe/Madrid}

    healthcheck:
      test: ["CMD", "mosquitto_sub", "-h", "localhost", "-p", "1883", "-t", "$$SYS/broker/uptime", "-C", "1", "-u", "${MQTT_USER_HA:-homeassistant}", "-P", "${MQTT_PASS_HA}", "-W", "3"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
