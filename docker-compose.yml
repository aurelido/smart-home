# ============================================
# CASA NÓRDICA - Docker Compose Configuration
# ============================================
# Version: 1.0.0
# Last Updated: 2026-03-24
# Description: Main orchestration file for all services
# ============================================

version: '3.8'

# ============================================
# DEFAULT ENVIRONMENT VARIABLES
# ============================================
x-environment: &default-environment
  TZ: ${TZ}
  PUID: ${PUID}
  PGID: ${PGID}

# ============================================
# RESTART POLICY
# ============================================
x-restart-policy: &restart-policy
  restart: unless-stopped

# ============================================
# LOGGING CONFIGURATION
# ============================================
x-logging: &logging-config
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
      compress: "true"

# ============================================
# SERVICES
# ============================================
services:

  # ============================================
  # HOME ASSISTANT
  # ============================================
  home-assistant:
    <<: [*restart-policy, *logging-config]
    image: ${HA_IMAGE}:${HA_TAG}
    container_name: ${HA_CONTAINER_NAME}
    hostname: home-assistant
    network_mode: ${NETWORK_MODE}
    privileged: false
    
    volumes:
      - ./homeassistant/config:/config:rw
      - ./homeassistant/ssl:/ssl:ro
      - ./homeassistant/addons:/addons:rw
      - ./homeassistant/media:/media:rw
      - ./backups/homeassistant:/backup:rw
      - /etc/localtime:/etc/localtime:ro
    
    environment:
      <<: *default-environment
    
    depends_on:
      mosquitto:
        condition: service_healthy
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${HA_PORT}/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    
    labels:
      - "com.synology.description=Home Assistant - Smart Home Hub"
      - "com.synology.version=${HA_TAG}"

  # ============================================
  # ZIGBEE2MQTT
  # ============================================
  zigbee2mqtt:
    <<: [*restart-policy, *logging-config]
    image: ${Z2M_IMAGE}:${Z2M_TAG}
    container_name: ${Z2M_CONTAINER_NAME}
    hostname: zigbee2mqtt
    network_mode: ${NETWORK_MODE}
    privileged: false
    
    volumes:
      - ./zigbee2mqtt/data:/app/data:rw
      - ./backups/zigbee2mqtt:/backup:rw
      - /run/udev:/run/udev:ro
    
    environment:
      <<: *default-environment
      ZIGBEE2MQTT_DATA: /app/data
    
    devices:
      - ${Z2M_DEVICE}:${Z2M_DEVICE}
    
    depends_on:
      mosquitto:
        condition: service_healthy
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${Z2M_PORT}/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    labels:
      - "com.synology.description=Zigbee2MQTT - Zigbee Coordinator"
      - "com.synology.version=${Z2M_TAG}"

  # ============================================
  # MOSQUITTO MQTT BROKER
  # ============================================
  mosquitto:
    <<: [*restart-policy, *logging-config]
    image: ${MQTT_IMAGE}:${MQTT_TAG}
    container_name: ${MQTT_CONTAINER_NAME}
    hostname: mosquitto
    network_mode: ${NETWORK_MODE}
    privileged: false
    
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data:rw
      - ./mosquitto/log:/mosquitto/log:rw
      - ./backups/mosquitto:/backup:rw
    
    environment:
      <<: *default-environment
    
    # Ports exposed directly via host network mode (no mapping needed)
    
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-h", "localhost", "-p", "${MQTT_PORT}", "-t", "$$SYS/broker/uptime", "-C", "1", "-u", "homeassistant", "-P", "${MQTT_PASSWORD}", "-W", "3"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    labels:
      - "com.synology.description=Mosquitto - MQTT Broker"
      - "com.synology.version=${MQTT_TAG}"
